<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills4Future feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Kalam:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5F1;
    --ink:#2B2B26;
    --ink-soft:#6B655A;
    --line:#E3E0D6;
    --accent:#0F766E;

    --cse:#FFE895;   /* yellow  */
    --cse-tape:#E8C24A;
    --it:#CFE7FF;    /* blue    */
    --it-tape:#8FB9E8;
    --mech:#FFD9C2;  /* peach   */
    --mech-tape:#E8A97C;
    --ece:#DCF2D3;   /* mint    */
    --ece-tape:#9FCB8C;
    --other:#EDE3FA; /* lavender*/
    --other-tape:#C7A9E8;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; }

  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:22px 10px 60px;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
    padding-bottom:22px;
    margin-bottom:30px;
    border-bottom:1px solid var(--line);
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(36px, 10vw, 46px);
    line-height:1.05;
    margin:0 0 8px;
  }

  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:16px;
  }

  .header-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:10px;
  }

  .add-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--ink);
    color:#fff;
    text-decoration:none;
    font-size:16px;
    font-weight:500;
    padding:14px 22px;
    border-radius:10px;
    transition:background .15s ease;
    border:none;
    cursor:pointer;
    white-space:nowrap;
  }
  .add-btn:hover{ background:var(--accent); }
  .add-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:14px;
    color:var(--ink-soft);
  }

  .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
  }
  .dot.live{ animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:.35; }
  }

  /* ---- Stack ---- */

  .stage{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
  }

  .nav-btn{
    position:relative;
    z-index:10;
    flex:none;
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color .15s ease, color .15s ease, transform .1s ease;
  }
  @media (min-width:700px){
    .nav-btn{ width:48px; height:48px; font-size:22px; }
    .stage{ gap:14px; }
  }
  .nav-btn:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
  .nav-btn:active:not(:disabled){ transform:scale(.94); }
  .nav-btn:disabled{ opacity:.3; cursor:default; }
  .nav-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .note-stack{
    position:relative;
    flex:1 1 auto;
    min-width:0;
    width:100%;
    max-width:600px;
  }

  .note-shadow{
    position:absolute;
    inset:0;
    border-radius:4px;
    background:#EDE9DD;
    border:1px solid var(--line);
  }
  .note-shadow.s1{ transform:translate(-7px, 6px); z-index:1; }
  .note-shadow.s2{ transform:translate(7px, 3px); z-index:2; opacity:.85; }

  .note{
    position:relative;
    z-index:3;
    border-radius:4px;
    padding:26px 14px 22px;
    box-shadow:0 10px 26px rgba(30,20,10,.16);
    animation:pop .25s ease both;
    display:flex;
    flex-direction:column;
  }
  @keyframes pop{
    from{ opacity:0; transform:scale(.97); }
    to{ opacity:1; transform:scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    .note, .dot.live{ animation:none; }
  }

  .note::after{
    content:"";
    position:absolute;
    right:0; bottom:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 0 24px 24px;
    border-color:transparent transparent rgba(0,0,0,.08) transparent;
  }

  .note.cse{ background:var(--cse); }
  .note.it{ background:var(--it); }
  .note.mech{ background:var(--mech); }
  .note.ece{ background:var(--ece); }
  .note.other{ background:var(--other); }

  .tape{
    position:absolute;
    top:-10px;
    left:50%;
    width:84px;
    height:24px;
    transform:translateX(-50%) rotate(-2deg);
    opacity:.85;
    border-radius:1px;
  }
  .tape.cse{ background:var(--cse-tape); }
  .tape.it{ background:var(--it-tape); }
  .tape.mech{ background:var(--mech-tape); }
  .tape.ece{ background:var(--ece-tape); }
  .tape.other{ background:var(--other-tape); }

  .note-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    margin-bottom:2px;
  }

  .note-name{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:19px;
    word-break:break-word;
  }

  .note-when{
    font-size:12px;
    color:var(--ink-soft);
    white-space:nowrap;
    flex:none;
  }

  .note-meta{
    margin:4px 0 16px;
    padding-bottom:14px;
    border-bottom:1px dashed rgba(0,0,0,.15);
  }
  .note-dept{
    display:block;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
  }
  .note-date{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .note-body{
    max-height:50vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-right:4px;
  }

  .note-text{
    font-family:'Kalam', cursive;
    font-size:clamp(16px, 4.6vw, 21px);
    line-height:1.55;
    color:var(--ink);
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
    margin:0;
  }

  .counter{
    text-align:center;
    font-size:15px;
    color:var(--ink-soft);
    margin-top:20px;
  }

  .empty, .error{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty h2, .error h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:23px;
    color:var(--ink);
    margin:0 0 8px;
  }
  .error{ display:none; }
  .error button{
    margin-top:14px;
    background:none;
    border:1px solid var(--line);
    color:var(--ink);
    padding:11px 18px;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
  }
  .error button:hover{ border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Skills4Future</h1>
        <p>Feedback from the Edunet agentic AI program</p>
      </div>
      <div class="header-right">
        <a class="add-btn" id="addBtn" href="#" target="_blank" rel="noopener">Add feedback</a>
        <div class="status">
          <span class="dot live" id="liveDot"></span>
          <span id="statusText">Loading…</span>
        </div>
      </div>
    </header>

    <div class="stage" id="stage">
      <button class="nav-btn" id="prevBtn" aria-label="Previous feedback">&#8249;</button>
      <div class="note-stack" id="noteStack"></div>
      <button class="nav-btn" id="nextBtn" aria-label="Next feedback">&#8250;</button>
    </div>
    <div class="counter" id="counter"></div>

    <div class="error" id="errorBox">
      <h2>Couldn't load feedback</h2>
      <p>Check your connection and try again.</p>
      <button id="retryBtn">Retry</button>
    </div>
  </div>

<script>
  // ---- Configuration ----
  // 1. In your Google Form, open the Responses tab and create the linked Sheet.
  // 2. In that Sheet: File > Share > Publish to web > select the responses
  //    sheet/tab > format "Comma-separated values (.csv)" > Publish.
  // 3. Paste the resulting URL below.
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEijSktyMFps2lbOAFbmWnsVq_fBDvRuU-4WGzcAyOFNYy0uurEWdkHqYMODZCIJYmsM0aCKd3CoSr/pub?output=csv";

  // Paste the public Google Form URL (the one people fill out, not the edit link).
  const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdbmmTHeo_-FzT_Pd8ygLvQNYNpaz3HCngapg0JvTjN0fXY7Q/viewform?usp=header";

  const POLL_MS = 20000;

  document.getElementById('addBtn').href = FORM_URL;

  const stage = document.getElementById('stage');
  const noteStack = document.getElementById('noteStack');
  const counterEl = document.getElementById('counter');
  const statusEl = document.getElementById('statusText');
  const dotEl = document.getElementById('liveDot');
  const errorBox = document.getElementById('errorBox');
  const retryBtn = document.getElementById('retryBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  let records = [];
  let index = 0;
  let currentKey = null;
  let lastRenderedKey = null;
  let firstLoad = true;

  function recKey(rec){ return rec.timestamp + '|' + rec.name; }

  function deptClass(dept){
    const d = (dept || '').toLowerCase();
    if (d.includes('computer')) return 'cse';
    if (d.includes('information')) return 'it';
    if (d.includes('mechanical')) return 'mech';
    if (d.includes('electronics')) return 'ece';
    return 'other';
  }

  function shortDept(dept){
    const d = (dept || '').toLowerCase();
    if (d.includes('computer')) return 'Computer Science & Engg';
    if (d.includes('information')) return 'Information Technology';
    if (d.includes('mechanical')) return 'Mechanical Engineering';
    if (d.includes('electronics')) return 'Electronics & Comm. Engg';
    return dept || 'Unknown department';
  }

  function relativeTime(dateStr){
    const then = new Date(dateStr);
    if (isNaN(then)) return '';
    const diffSec = Math.round((Date.now() - then.getTime()) / 1000);
    if (diffSec < 60) return 'just now';
    const diffMin = Math.round(diffSec / 60);
    if (diffMin < 60) return diffMin + (diffMin === 1 ? ' minute ago' : ' minutes ago');
    const diffHr = Math.round(diffMin / 60);
    if (diffHr < 24) return diffHr + (diffHr === 1 ? ' hour ago' : ' hours ago');
    const diffDay = Math.round(diffHr / 24);
    if (diffDay < 7) return diffDay + (diffDay === 1 ? ' day ago' : ' days ago');
    return then.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }

  function formatDate(dateStr){
    if (!dateStr) return '';
    const d = new Date(dateStr);
    if (isNaN(d)) return dateStr;
    return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  }

  // Minimal CSV parser that handles quoted fields, embedded commas/newlines.
  function parseCSV(text){
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ','){ row.push(field); field = ''; }
        else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
        else if (c === '\r'){ /* ignore */ }
        else field += c;
      }
    }
    if (field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(f => f.trim() !== ''));
  }

  function rowsToRecords(rows){
    if (!rows.length) return [];
    const header = rows[0].map(h => h.trim().toLowerCase());
    const idx = {
      timestamp: header.findIndex(h => h.includes('timestamp')),
      name: header.findIndex(h => h === 'name'),
      dept: header.findIndex(h => h.includes('department')),
      date: header.findIndex(h => h === 'date'),
      feedback: header.findIndex(h => h.includes('feedback')),
    };
    return rows.slice(1).map(r => ({
      timestamp: idx.timestamp > -1 ? r[idx.timestamp] : '',
      name: (idx.name > -1 ? r[idx.name] : '').trim() || 'Anonymous',
      department: idx.dept > -1 ? r[idx.dept] : '',
      date: idx.date > -1 ? r[idx.date] : '',
      feedback: idx.feedback > -1 ? r[idx.feedback] : '',
    }));
  }

  function showEmpty(){
    stage.style.display = 'none';
    counterEl.style.display = 'none';
    errorBox.style.display = 'none';
    let empty = document.getElementById('emptyBox');
    if (!empty){
      empty = document.createElement('div');
      empty.id = 'emptyBox';
      empty.className = 'empty';
      empty.innerHTML = '<h2>No feedback yet</h2><p>Be the first to share yours.</p>';
      stage.parentNode.insertBefore(empty, errorBox);
    }
    empty.style.display = 'block';
  }

  function hideEmpty(){
    const empty = document.getElementById('emptyBox');
    if (empty) empty.style.display = 'none';
    stage.style.display = 'flex';
    counterEl.style.display = 'block';
  }

  function renderStack(){
    if (!records.length){
      showEmpty();
      statusEl.textContent = 'Live · 0 responses';
      return;
    }
    hideEmpty();
    errorBox.style.display = 'none';

    const rec = records[index];
    const cls = deptClass(rec.department);
    const key = recKey(rec);

    if (key === lastRenderedKey && noteStack.querySelector('.note')){
      // Same note still on screen (e.g. a background refresh) — update only
      // the relative time, don't touch the DOM or scroll position.
      const whenEl = noteStack.querySelector('.note-when');
      if (whenEl) whenEl.textContent = relativeTime(rec.timestamp);
    } else {
      noteStack.innerHTML = `
        <div class="note-shadow s1"></div>
        <div class="note-shadow s2"></div>
        <div class="note ${cls}">
          <div class="tape ${cls}"></div>
          <div class="note-top">
            <span class="note-name"></span>
            <span class="note-when"></span>
          </div>
          <div class="note-meta">
            <span class="note-dept"></span>
            <span class="note-date"></span>
          </div>
          <div class="note-body">
            <p class="note-text"></p>
          </div>
        </div>
      `;
      noteStack.querySelector('.note-name').textContent = rec.name;
      noteStack.querySelector('.note-when').textContent = relativeTime(rec.timestamp);
      noteStack.querySelector('.note-dept').textContent = shortDept(rec.department);
      noteStack.querySelector('.note-date').textContent = formatDate(rec.date);
      noteStack.querySelector('.note-text').textContent = rec.feedback;
      lastRenderedKey = key;
    }

    counterEl.textContent = `${index + 1} of ${records.length}`;
    prevBtn.disabled = records.length <= 1;
    nextBtn.disabled = records.length <= 1;

    statusEl.textContent = `Live · ${records.length} response${records.length === 1 ? '' : 's'}`;
  }

  function goNext(){
    if (records.length <= 1) return;
    index = (index + 1) % records.length;
    currentKey = recKey(records[index]);
    renderStack();
  }

  function goPrev(){
    if (records.length <= 1) return;
    index = (index - 1 + records.length) % records.length;
    currentKey = recKey(records[index]);
    renderStack();
  }

  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') goNext();
    if (e.key === 'ArrowLeft') goPrev();
  });

  function applyNewRecords(newRecords){
    newRecords.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    if (firstLoad){
      records = newRecords;
      index = 0;
      currentKey = records.length ? recKey(records[0]) : null;
      firstLoad = false;
    } else {
      const wasAtLatest = index === 0;
      records = newRecords;
      if (!records.length){
        index = 0; currentKey = null;
      } else if (wasAtLatest){
        index = 0;
        currentKey = recKey(records[0]);
      } else {
        const foundIdx = records.findIndex(r => recKey(r) === currentKey);
        index = foundIdx > -1 ? foundIdx : Math.min(index, records.length - 1);
        currentKey = recKey(records[index]);
      }
    }
    renderStack();
  }

  async function load(){
    try{
      const res = await fetch(CSV_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('Bad response');
      const text = await res.text();
      const newRecords = rowsToRecords(parseCSV(text));
      applyNewRecords(newRecords);
    } catch (err){
      if (firstLoad){
        stage.style.display = 'none';
        counterEl.style.display = 'none';
        errorBox.style.display = 'block';
        statusEl.textContent = 'Offline';
        dotEl.classList.remove('live');
      }
      console.error('Failed to load feedback:', err);
    }
  }

  retryBtn.addEventListener('click', load);

  load();
  setInterval(load, POLL_MS);
</script>
</body>
</html>
